services:
    minio:
        image: quay.io/minio/minio:latest
        container_name: minio
        ports:
            - "9000:9000" # API port
            - "9001:9001" # Web Console port
        environment:
            MINIO_ROOT_USER: admin
            MINIO_ROOT_PASSWORD: admin123
        volumes:
            - ./data:/data # Persists data to a local 'data' folder
        command: server /data --console-address ":9001"
        restart: always

    mc:
        image: quay.io/minio/mc:latest
        depends_on:
            - minio
        entrypoint: >
            /bin/sh -c "
            sleep 5;
            /usr/bin/mc alias set local http://minio:9000 admin admin123;
            /usr/bin/mc mb local/my-bucket --ignore-existing;
            /usr/bin/mc anonymous set download local/my-bucket;
            exit 0;
            "
